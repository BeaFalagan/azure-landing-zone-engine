# pre-commit 4.x. Install: pip install pre-commit && pre-commit install
# Tools expected in PATH: terraform 1.17.1, tflint 0.65.0, terraform-docs 0.24.0, checkov 3.4.3.
default_install_hook_types: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-json
      - id: check-yaml
      - id: detect-private-key

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.4
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        # Modules with configuration_aliases cannot be validated alone; they are validated through examples/.
        exclude: ^engine/modules/network/[^/]+\.tf$
        args:
          - --tf-init-args=-backend=false
          - --hook-config=--retry-once-with-cleanup=true
      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl
      - id: terraform_docs
        args:
          - --hook-config=--path-to-file=README.md
          - --hook-config=--add-to-existing-file=true
          - --hook-config=--create-file-if-not-exist=true
          - --args=--config=.terraform-docs.yml
      - id: terraform_checkov
        args:
          - --args=--config-file __GIT_WORKING_DIR__/.checkov.yaml

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.39.0
    hooks:
      - id: check-metaschema
        name: engine schemas are valid JSON Schema
        files: ^engine/schema/[a-z]+\.schema\.json$
      - id: check-jsonschema
        name: example projects match the current project schema
        files: ^engine/(examples|root/tests/fixtures)/projects/[a-z][a-z0-9]{1,5}/[a-z][a-z0-9]{1,13}/(dev|pre|pro)\.yaml$
        args: [--schemafile, engine/schema/project.schema.json]
      - id: check-jsonschema
        name: platform file matches the platform schema
        files: ^(projects/_platform/|engine/examples/)platform\.yaml$
        args: [--schemafile, engine/schema/platform.schema.json]
      - id: check-github-workflows
      - id: check-github-actions

  - repo: local
    hooks:
      - id: plain-yaml
        name: data files are plain YAML (no anchors, aliases, tags, duplicates)
        entry: python3 scripts/check_plain_yaml.py
        language: python
        additional_dependencies: [pyyaml==6.0.3]
        files: ^(projects/.*|engine/(catalog|examples|schema/tests|root/tests/fixtures)/.*)\.yaml$
      - id: project-schema
        name: project files match the schema of their engine_version
        entry: python3 scripts/validate_project.py
        language: python
        additional_dependencies: [pyyaml==6.0.3, jsonschema==4.26.0]
        files: ^projects/[a-z][a-z0-9]{1,5}/[a-z][a-z0-9]{1,13}/[a-z]+\.yaml$
      - id: cross-project
        name: no shared subscriptions or overlapping address spaces between projects
        entry: python3 scripts/check_cross_project.py
        language: python
        additional_dependencies: [pyyaml==6.0.3]
        files: ^projects/
        pass_filenames: false
      - id: ci-scripts-tests
        name: unit tests of the CI scripts
        entry: python3 -m unittest discover --start-directory scripts/tests --top-level-directory scripts
        language: python
        additional_dependencies: [pyyaml==6.0.3, jsonschema==4.26.0]
        files: ^(scripts/|engine/(catalog|schema)/)
        pass_filenames: false
      - id: schema-catalog-sync
        name: schema enums match the engine catalog
        entry: python3 scripts/check_schema_catalog.py
        language: python
        additional_dependencies: [pyyaml==6.0.3]
        files: ^engine/(schema|catalog)/
        pass_filenames: false
      - id: schema-tests
        name: schema test cases
        entry: python3 scripts/test_schema.py
        language: python
        additional_dependencies: [pyyaml==6.0.3, jsonschema==4.26.0]
        files: ^engine/(schema|catalog)/
        pass_filenames: false
      - id: terraform-test
        name: terraform test (mocked providers)
        entry: scripts/test-all.sh
        language: system
        files: (\.tf|\.tftest\.hcl|catalog\.yaml)$
        pass_filenames: false
