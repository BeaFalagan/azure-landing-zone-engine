engine_version: "1.0.0"
business_unit: pga
project: billing
environment: pro
subscription_id: "00000000-0000-0000-0000-000000000000"
location: westeurope

tags:
  cost_center: "ES0009"
  business_owner: owner@example.com
  technical_owner: team@example.com
  data_classification: confidential

access:
  - name: readers
    roles: [Reader]
  - name: developers
    description: Application team
    roles: [Contributor, Key Vault Secrets User]
    members: [ana@example.com, luis@example.com]

network:
  address_space: ["10.48.48.0/20"]
  peer_to_hub: true
  dns_servers: []
  subnets:
    - name: app
      prefix: "10.48.48.0/24"
      service_endpoints: [Microsoft.Storage, Microsoft.KeyVault]
      nsg_rules:
        - name: allow-https-from-hub
          direction: inbound
          access: allow
          protocol: tcp
          source: hub
          ports: ["443"]
        - name: allow-lb-probes
          direction: inbound
          access: allow
          protocol: any
          source: azure-lb
          priority: 4000
    - name: db
      prefix: "10.48.49.0/24"
      delegation: postgresql
      nsg_rules:
        - name: allow-pg-from-app
          direction: inbound
          access: allow
          protocol: tcp
          source: "10.48.48.0/24"
          ports: ["5432"]

monitoring:
  log_analytics: true

overrides:
  resource_group_name: rg-billing-legacy
  justification: Existing resource group imported from the previous platform (ticket PLAT-123).
